name: Report a problem
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Help (?) → About shows the version, e.g. 1.3.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 11, Windows 10, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you click, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: shots
    attributes:
      label: Screenshots
      description: Drag images here if you can. Please blur real student names.
