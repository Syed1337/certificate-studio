<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">
  <title>Mac: right-click the app and choose Open, or use Open Anyway in Privacy and Security</title>
  <rect width="920" height="330" rx="16" fill="#f5f1e8"/>
  <!-- step 1: right-click -> Open -->
  <g transform="translate(24,24)">
    <rect width="270" height="282" rx="12" fill="#fff" stroke="#d9d3c4"/>
    <rect x="18" y="34" width="64" height="64" rx="15" fill="#1b2540"/><rect x="28" y="50" width="44" height="30" rx="3" fill="#f8f4ea"/><circle cx="62" cy="80" r="11" fill="#d4ac4c"/>
    <text x="50" y="118" font-size="11" text-anchor="middle" fill="#333">Certificate</text><text x="50" y="132" font-size="11" text-anchor="middle" fill="#333">Studio</text>
    <rect x="96" y="62" width="150" height="122" rx="8" fill="#f6f6f6" stroke="#cfcfcf"/>
    <rect x="102" y="70" width="138" height="24" rx="5" fill="#2f6fde"/>
    <text x="112" y="87" font-size="14" fill="#fff" font-weight="600">Open</text>
    <text x="112" y="114" font-size="13" fill="#555">Show Package Contents</text>
    <text x="112" y="138" font-size="13" fill="#555">Move to Bin</text>
    <text x="112" y="162" font-size="13" fill="#555">Get Info</text>
    <rect x="98" y="66" width="146" height="32" rx="7" fill="none" stroke="#e8b931" stroke-width="4"/>
    <text x="135" y="232" font-size="15" text-anchor="middle" fill="#1b2540" font-weight="600">Right-click (or Control-click)</text>
    <text x="135" y="254" font-size="15" text-anchor="middle" fill="#1b2540">the app → Open</text>
    <circle cx="248" cy="22" r="17" fill="#e8b931"/><text x="248" y="29" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2540">1</text>
  </g>
  <!-- step 2: dialog Open -->
  <g transform="translate(318,24)">
    <rect width="270" height="282" rx="12" fill="#fff" stroke="#d9d3c4"/>
    <rect x="103" y="26" width="64" height="64" rx="15" fill="#1b2540"/><rect x="113" y="42" width="44" height="30" rx="3" fill="#f8f4ea"/><circle cx="147" cy="72" r="11" fill="#d4ac4c"/>
    <rect x="40" y="108" width="190" height="9" rx="4" fill="#bbb"/><rect x="60" y="124" width="150" height="9" rx="4" fill="#ddd"/><rect x="50" y="140" width="170" height="9" rx="4" fill="#ddd"/>
    <rect x="30" y="168" width="210" height="30" rx="7" fill="#2f6fde"/><text x="135" y="188" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Open</text>
    <rect x="26" y="164" width="218" height="38" rx="9" fill="none" stroke="#e8b931" stroke-width="4"/>
    <rect x="30" y="208" width="210" height="30" rx="7" fill="#e9e9e9"/><text x="135" y="228" font-size="14" fill="#333" text-anchor="middle">Cancel</text>
    <text x="135" y="264" font-size="15" text-anchor="middle" fill="#1b2540" font-weight="600">Click Open</text>
    <circle cx="248" cy="22" r="17" fill="#e8b931"/><text x="248" y="29" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2540">2</text>
  </g>
  <!-- macOS 15+: Privacy & Security -->
  <g transform="translate(612,24)">
    <rect width="284" height="282" rx="12" fill="#fff" stroke="#d9d3c4"/>
    <rect x="0" y="0" width="284" height="40" rx="12" fill="#1b2540"/><rect x="0" y="26" width="284" height="14" fill="#1b2540"/>
    <text x="142" y="26" font-size="13" text-anchor="middle" fill="#f3d27a" font-weight="700">macOS 15 Sequoia or later</text>
    <text x="22" y="72" font-size="14" fill="#333">System Settings</text>
    <text x="22" y="94" font-size="14" fill="#333" font-weight="600">→ Privacy &amp; Security</text>
    <rect x="22" y="112" width="240" height="9" rx="4" fill="#ddd"/>
    <text x="22" y="146" font-size="12" fill="#555">"Certificate Studio" was blocked…</text>
    <rect x="150" y="160" width="112" height="28" rx="7" fill="#e9e9e9"/><text x="206" y="179" font-size="13" fill="#111" font-weight="600" text-anchor="middle">Open Anyway</text>
    <rect x="145" y="155" width="122" height="38" rx="9" fill="none" stroke="#e8b931" stroke-width="4"/>
    <text x="142" y="230" font-size="13" text-anchor="middle" fill="#1b2540">Try to open the app once,</text>
    <text x="142" y="250" font-size="13" text-anchor="middle" fill="#1b2540">then scroll down and click</text>
    <text x="142" y="270" font-size="13" text-anchor="middle" fill="#1b2540" font-weight="600">Open Anyway</text>
  </g>
</svg>
