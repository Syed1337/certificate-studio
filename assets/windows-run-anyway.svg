<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title>Windows: click More info, then Run anyway</title>
  <rect width="920" height="330" rx="16" fill="#f5f1e8"/>
  <!-- step 1 -->
  <g transform="translate(24,24)">
    <rect width="410" height="282" rx="6" fill="#1565c0"/>
    <text x="22" y="46" fill="#fff" font-size="21" font-weight="600">Windows protected your PC</text>
    <rect x="22" y="70" width="330" height="9" rx="4" fill="#fff" opacity=".55"/>
    <rect x="22" y="88" width="290" height="9" rx="4" fill="#fff" opacity=".55"/>
    <rect x="22" y="106" width="200" height="9" rx="4" fill="#fff" opacity=".55"/>
    <text x="22" y="148" fill="#fff" font-size="16" text-decoration="underline">More info</text>
    <ellipse cx="60" cy="143" rx="54" ry="20" fill="none" stroke="#e8b931" stroke-width="4"/>
    <path d="M96 150 l0 26 l7 -6 l5 11 l5 -2 l-5 -11 l9 -1z" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <rect x="290" y="232" width="100" height="32" fill="#fff" opacity=".9"/>
    <text x="340" y="253" fill="#333" font-size="14" text-anchor="middle">Don't run</text>
    <circle cx="388" cy="22" r="17" fill="#e8b931"/><text x="388" y="29" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2540">1</text>
  </g>
  <path d="M446 165 h20" stroke="#1b2540" stroke-width="4" stroke-linecap="round"/><path d="M464 155 l12 10 l-12 10z" fill="#1b2540"/>
  <!-- step 2 -->
  <g transform="translate(486,24)">
    <rect width="410" height="282" rx="6" fill="#1565c0"/>
    <text x="22" y="46" fill="#fff" font-size="21" font-weight="600">Windows protected your PC</text>
    <rect x="22" y="70" width="330" height="9" rx="4" fill="#fff" opacity=".55"/>
    <rect x="22" y="88" width="250" height="9" rx="4" fill="#fff" opacity=".55"/>
    <text x="22" y="134" fill="#fff" font-size="14">App:  Certificate-Studio-Windows.exe</text>
    <text x="22" y="158" fill="#fff" font-size="14">Publisher:  Unknown publisher</text>
    <rect x="176" y="232" width="110" height="32" fill="#fff"/>
    <text x="231" y="253" fill="#111" font-size="14" font-weight="600" text-anchor="middle">Run anyway</text>
    <rect x="170" y="226" width="122" height="44" rx="4" fill="none" stroke="#e8b931" stroke-width="4"/>
    <path d="M252 258 l0 26 l7 -6 l5 11 l5 -2 l-5 -11 l9 -1z" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <rect x="296" y="232" width="100" height="32" fill="#fff" opacity=".9"/>
    <text x="346" y="253" fill="#333" font-size="14" text-anchor="middle">Don't run</text>
    <circle cx="388" cy="22" r="17" fill="#e8b931"/><text x="388" y="29" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2540">2</text>
  </g>
</svg>
